services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: postz-postgres
    restart: always
    environment:
      POSTGRES_USER: postz_user
      POSTGRES_PASSWORD: postz_password
      POSTGRES_DB: postz_db
    ports:
      - "5433:5432"
    volumes:
      - postz_pgdata:/var/lib/postgresql/data

volumes:
  postz_pgdata:
