# Render Blueprint for Pigeon
services:
  - type: web
    name: pigeon-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pigeondb
          property: connectionString
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://pigeon-client-yayt.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  - type: web
    name: pigeon-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pigeon-backend-5pkk.onrender.com
